[project]
name = "norma-api"
version = "0.1.0"
description = "API системы сопровождения этапов ВКР"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi[standard]>=0.115,<1",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32,<1",
    "basedpyright>=1.28,<2",
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["app", "alembic", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a dedicated PostgreSQL test database"]
