<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Норма — каталог интерфейсов</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="tokens.css"><style>
*{box-sizing:border-box;border-radius:0!important}body{margin:0;background:var(--color-bg);color:var(--color-text);font:400 14px/20px var(--font-ui)}button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button,input,select,textarea{border:1px solid var(--color-control-border);background:white;min-height:36px;padding:0 12px}textarea{padding:8px;width:100%}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}button:hover{background:#EAF2F6}button.primary{background:var(--color-primary);border-color:var(--color-primary);color:white}button.accent{background:var(--color-accent);border-color:var(--color-accent);color:white}button.danger{background:var(--color-error);color:white}button:disabled{background:var(--color-disabled-bg);color:var(--color-disabled-text);cursor:not-allowed}header{height:56px;background:var(--color-header);color:white;display:flex;align-items:center;gap:16px;padding:0 32px}header strong{font-size:24px;font-weight:500}header nav{display:flex;align-items:stretch;height:100%}header nav button{background:none;color:var(--color-header-muted);border:0;padding:0 16px}header nav button.active{background:var(--blue-800);color:white;box-shadow:inset 0 -3px var(--green-500)}.spacer{flex:1}main{max-width:1264px;margin:auto;padding:32px}h1,h2,h3{font-weight:500;margin:0 0 16px}h1{font-size:24px;line-height:32px}h2{font-size:18px;line-height:24px}h3{font-size:16px;line-height:24px}p{margin:8px 0}small,.muted{color:var(--color-muted);font-size:12px}.surface{background:white;border:1px solid var(--color-border);padding:20px}.section{margin-top:32px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.stage{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:24px}.stage span{border-top:4px solid var(--color-border);padding-top:8px;font-size:12px}.stage .done{border-color:var(--color-accent)}.stage .current{border-color:var(--color-primary);color:var(--color-primary);font-weight:500}.status{display:inline-flex;align-items:center;white-space:nowrap;width:max-content;height:24px;padding:0 8px;color:white;font:400 12px/16px var(--font-ui)}.idle{background:var(--status-idle)}.review{background:var(--status-review)}.changes{background:var(--status-changes)}.success{background:var(--status-success)}.rejected{background:var(--status-rejected)}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--color-border);height:44px}th{background:var(--color-table-head);font-weight:500;font-size:12px}.scroll{overflow:auto}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--color-border);margin-bottom:24px}.tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:8px 0}.tabs .active{border-color:var(--color-primary);color:var(--color-primary);font-weight:500}.file,.remark{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--color-border);padding:12px;background:white}.filetype{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--color-control-border);font-size:12px;color:var(--color-muted)}a,.link{color:var(--color-primary)}.link{border:0;background:none;padding:0;min-height:24px}.workspace{height:calc(100vh - 34px);display:flex;flex-direction:column}.workspace header{padding:0 16px;flex-shrink:0}.workspace header button{min-height:32px}.workspace header small{color:var(--color-header-muted)}.menu,.toolbar,.foot{display:flex;align-items:center;gap:8px;background:white;padding:4px 12px;border-bottom:1px solid var(--color-border);flex-shrink:0}.menu button,.toolbar button{min-height:28px;border:0;padding:0 6px;background:transparent}.toolbar{background:var(--color-bg);min-height:40px;flex-wrap:wrap}.toolbar select{min-height:28px;padding:0 6px;font-size:13px}.workbody{display:flex;min-height:0;flex:1}.outline,.aux{background:white;overflow:auto;padding:12px;flex-shrink:0}.outline{width:var(--editor-outline-width);border-right:1px solid var(--color-border)}.outline button{display:block;width:100%;text-align:left;border:0;min-height:28px;padding:4px 8px;font-size:13px}.outline button.active{background:var(--color-selected);border-left:2px solid var(--color-primary)}.canvas{flex:1;min-width:0;overflow:auto;background:var(--color-canvas);padding:20px}.paper{background:white;border:1px solid var(--color-control-border);width: min(794px,100%);min-width:360px;min-height:900px;margin:0 auto 16px;padding:60px 48px 60px 65px;font: 14pt/1.5 var(--font-document)}.paper h3{font: bold 14pt/1.5 var(--font-document);text-align:center}.paper p{text-indent:1.25cm;text-align:justify}.aux{width:var(--editor-panel-width);min-width:240px;max-width:480px;resize:horizontal;border-left:1px solid var(--color-border)}.rail{width:32px;background:var(--color-bg);border-left:1px solid var(--color-border);flex-shrink:0}.rail button{width:32px;min-height:36px;padding:0;border:0;font-size:16px;background:none}.rail button.active{background:var(--color-tool-selected)}.foot{height:28px;color:var(--color-muted);font-size:12px;border-top:1px solid var(--color-border)}.old,.new{padding:8px 12px;border-left:3px solid var(--color-error);background:var(--color-diff-old);margin:8px 0}.new{background:var(--color-diff-new);border-color:var(--color-accent)}.comment{background:var(--color-bg);border-left:2px solid var(--color-primary);padding:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:740px}.split .paper{min-width:0;padding:24px;font-size:12pt}.auth{width:min(420px,100%);margin:32px auto}.field{display:grid;gap:4px;margin:12px 0}.field input{width:100%}.catalog{height:34px;display:flex;gap:8px;align-items:center;padding:0 12px;background:#E9EDEE;overflow:auto;white-space:nowrap}.catalog button{min-height:26px;font-size:12px;padding:0 8px}.notice{border-left:3px solid var(--color-primary);background:var(--color-selected);padding:12px}.hidden,[hidden]{display:none!important}dialog{border:1px solid var(--color-control-border);padding:24px;width:min(460px,90vw)}dialog::backdrop{background:#DCE2E4} @media(max-width:850px){header{padding:0 12px;gap:6px}header nav button{padding:0 7px}main{padding:16px}.outline{width:180px}.paper{padding:32px;min-width:300px}.stage{overflow:auto}.stage span{min-width:110px}.aux{width:240px}}
</style></head><body><div class="catalog"><strong>Каталог · демо</strong><button data-page="home">Моя ВКР</button><button data-page="editor">Редактор</button><button data-page="reviews">Проверки</button><button data-page="materials">Материалы</button><button data-page="login">Вход</button><button data-page="register">Регистрация</button><button data-page="profile">Профиль</button><button data-page="kit">Компоненты</button></div><div id="app"></div><dialog id="modal"><h2 id="modal-title"></h2><div id="modal-body"></div><div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="modal.close()">Закрыть</button></div></dialog><script>
const app=document.getElementById('app'),modal=document.getElementById('modal');let page='home',tab=0,mode='edit',panel='comments',outline=true,decision='',resolved=false,query='',chapter=1,highlight=true,inline=false,unread=2;const names=['Введение','1. Аналитическая часть','2. Проектирование','3. Реализация','Заключение'];const states=[['Проверено успешно','success'],['Нужны правки','changes'],['На проверке','review'],['Не отправлено','idle'],['Не отправлено','idle']];const files=[['Методические указания','Методические рекомендации по выполнению ВКР','PDF','1,8 МБ'],['Методические указания','Требования к структуре ВКР','PDF','540 КБ'],['Шаблоны документов','Титульный лист ВКР','DOCX','24 КБ'],['Шаблоны документов','Индивидуальное задание','DOCX','36 КБ'],['Нормативные документы','ГОСТ 7.32-2017','PDF','1,2 МБ']];const old='Выпускная работа проходит несколько этапов проверки.',next='Выпускная квалификационная работа проходит последовательные этапы содержательной проверки и нормоконтроля.';const status=(s,c)=>`<span class="status ${c}">${s}</span>`;function go(p){page=p;render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));function head(){return `<header><strong>Норма</strong><nav>${[['home','Моя ВКР'],['editor','Редактор'],['reviews','Проверки'],['materials','Материалы']].map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('')}</nav><span class="spacer"></span><button style="min-height:32px" onclick="notifications()">Уведомления ${unread||''}</button><button style="min-height:32px" onclick="go('profile')">СБ</button></header>`}function dialog(t,b){document.getElementById('modal-title').textContent=t;document.getElementById('modal-body').innerHTML=b;modal.showModal()}function notifications(){dialog('Уведомления',`<button class="link" onclick="unread=0;modal.close();render();notifications()">Прочитать все</button><p class="${unread?'notice':''}">Получены замечания к первой главе · Сегодня</p><p>Глава согласована · Вчера</p><button onclick="modal.close();panel='comments';mode='review';go('editor')">Перейти к правкам</button>`)}function home(){return `<h1>Моя выпускная работа</h1><p class="muted">2026/2027 учебный год</p><div class="surface"><small>Тема ВКР</small><h2 style="margin:8px 0">Разработка информационной системы сопровождения выпускных квалификационных работ</h2><p class="muted">Научный руководитель: Фамилия И. О.</p><div class="stage">${['Утверждение темы','Подготовка','Проверка','Нормоконтроль','Допуск к защите'].map((s,i)=>`<span class="${i<2?'done':i===2?'current':''}">${s}${i===2?'<br><small>Текущий этап</small>':''}</span>`).join('')}</div></div><section class="section"><div class="row between"><h2>Замечания руководителя</h2><button class="link" onclick="go('reviews')">Все замечания →</button></div>${['Уточнить описание предметной области','Дополнить сравнительный анализ','Скорректировать постановку цели'].map(s=>`<div class="remark"><small>Глава 1</small><span>${s}</span><span class="spacer"></span><button class="link" onclick="panel='comments';mode='review';go('editor')">Открыть →</button></div>`).join('')}</section><section class="section"><h2>Ближайшие сроки</h2><div class="row between">Согласование первой главы <span class="muted">5 декабря 2026</span></div></section>`}function reviews(){return `<h1>Проверки</h1><div class="tabs">${['Научный руководитель','Антиплагиат','Нормоконтроль'].map((s,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${s}</button>`).join('')}</div>${tab===0?`<h2>Согласование разделов</h2><div class="scroll"><table><thead><tr><th>Раздел документа</th><th>Статус</th><th>Обновлено</th><th>Замечания</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td><button class="link" onclick="chapter=${i};dialog('Согласование раздела','<p>Демонстрационная версия проверки.</p><button onclick=&quot;modal.close();mode=\'review\';panel=\'comments\';go(\'editor\')&quot;>Перейти в редактор</button>')">${n}</button></td><td>${status(...states[i])}</td><td>${i<3?'27.11.2026':'—'}</td><td>${['0','3','—','—','—'][i]}</td></tr>`).join('')}</tbody></table></div><p class="muted">История отправок и проверок</p>`:tab===1?`<div class="surface"><small>Последний результат · тестовые данные</small><div class="row between">${[['82%','Оригинальность'],['12%','Заимствования'],['6%','Цитирование']].map(([v,k])=>`<div><h1>${v}</h1>${k}</div>`).join('')}</div><div style="display:flex;height:8px;margin:20px 0"><div style="flex:82;background:#395D30"></div><div style="flex:12;background:#986323"></div><div style="flex:6;background:#327799"></div></div>${status('Проверка завершена','success')} <small>Версия 6 · 25 ноября</small></div><h2 class="section">История проверок</h2><p>25.11.2026 · Версия 6 · 82%</p><button class="primary" onclick="dialog('Новая проверка','Только демонстрационные документы; API не подключён.')">Новая проверка</button>`:`<div class="surface"><small>Статус нормоконтроля</small><p>${status('Нужны правки','changes')}</p><small>Версия 8 · Нормоконтролёр: Фамилия И. О.</small></div><h2 class="section">Замечания по оформлению</h2><div class="remark">Неверное оформление подписи рисунка <span class="spacer"></span>Стр. 14</div><button class="primary" onclick="dialog('Повторная отправка','Демо: сервер не подключён.')">Отправить повторно</button>`}`}function materialList(compact=false){return [...new Set(files.map(f=>f[0]))].map(g=>{let matches=files.filter(f=>f[0]===g&&f[1].toLowerCase().includes(query.toLowerCase()));return matches.length?`<h3 style="margin-top:20px">${g}</h3>${matches.map(f=>`<div class="file">${compact?'':`<span class="filetype">${f[2]}</span>`}<div style="flex:1">${f[1]}<br><small>${f[2]} · ${f[3]}</small></div><button class="link" onclick="dialog('Просмотр материала','Демонстрационный просмотр: файл не подключён.')">Открыть</button></div>`).join('')}`:''}).join('')||'<p>Материалы не найдены</p>'}function materials(){return `<h1>Материалы</h1><p class="muted">Документы и рекомендации по подготовке ВКР</p><input aria-label="Поиск по материалам" placeholder="Поиск по материалам" style="width:100%" oninput="query=this.value;document.getElementById('files').innerHTML=materialList()"><div id="files">${materialList()}</div>`}function editor(){const text=decision==='accepted'?next:old;const content=`<h3>${names[chapter]}</h3><p>Процесс подготовки выпускной квалификационной работы представляет собой последовательность взаимосвязанных этапов.</p><p ${mode==='edit'?'contenteditable="true"':''} style="${mode==='review'&&!resolved?'background:var(--color-comment)':''}">Согласование материалов осуществляется совместно с научным руководителем.</p>${mode==='review'&&!decision?`<div class="old">${old}</div><div class="new">${next}</div>`:`<p>${text}</p>`}<p>На основании проведённого исследования сформулированы требования к информационной системе.</p>`;const aux=panel==='comments'?`<div class="comment"><small>Глава 1 · Страница 8</small><p>Научный руководитель</p><p>Подробнее опишите процесс согласования материалов.</p>${resolved?'<small>Ожидает подтверждения руководителя</small>':`<textarea placeholder="Ответить..." aria-label="Ответ"></textarea><button onclick="dialog('Ответ','Демонстрационное действие')">Ответить</button> <button class="accent" onclick="resolved=true;render()">Исправлено</button>`}</div><p>Предложенная замена</p><div class="old"><small>Исходный текст</small><br>${old}</div><div class="new"><small>Предлагаемый текст</small><br>${next}</div>${decision?`<p>${decision==='accepted'?'Принято':'Отклонено'}</p><button onclick="decision='';render()">Отменить решение</button>`:`<button class="accent" onclick="decision='accepted';render()">Принять замену</button><button onclick="decision='rejected';render()">Отклонить</button>`}`:panel==='materials'?materialList(true):panel==='history'?'<p>Версия 8 · текущая</p><p>Версия 7 · 26 ноября</p><button onclick="mode=\'diff\';panel=\'\';render()">Сравнить с текущей</button>':'<p>Поля страницы</p>'+status('Соответствует','success')+'<p>Подписи рисунков</p>'+status('Нужны правки','changes');return `<div class="workspace"><header><button onclick="go('home')" aria-label="Вернуться">←</button><div>Выпускная квалификационная работа<br><small>Демонстрационный документ</small></div><span class="spacer"></span><button onclick="dialog('Экспорт','DOCX / PDF — демонстрационное меню')">Экспорт ▾</button><button class="accent" onclick="dialog('Отправка на проверку','Выберите разделы:<p><label><input type=checkbox> Введение</label></p><p><label><input type=checkbox> Глава 1</label></p>Сервер не подключён.')">На проверку</button></header><div class="menu">${['Файл','Правка','Вставка','Формат','Вид','Инструменты'].map(n=>`<button onclick="dialog('${n}','Демонстрационное меню инструментов')">${n}</button>`).join('')}</div><div class="toolbar"><button onclick="outline=!outline;render()">Структура</button>${mode!=='diff'?'<button>↶</button><button>↷</button><select aria-label="Масштаб"><option>100%</option><option>75%</option></select><select aria-label="Стиль"><option>Основной текст</option><option>Заголовок 1</option></select><span>Times New Roman</span><span>14</span><button>B</button><button>I</button><button>U</button>':`<span>Версия 7 → Версия 8</span><button onclick="inline=!inline;render()">${inline?'Два документа':'Совмещённый'}</button><label><input style="min-height:0" type="checkbox" ${highlight?'checked':''} onchange="highlight=this.checked;render()"> Выделение</label>`}<span class="spacer"></span><select aria-label="Режим" onchange="mode=this.value;panel=mode==='review'?'comments':'';render()">${[['edit','Редактирование'],['review','Рецензирование'],['diff','Сравнение версий']].map(([k,v])=>`<option value="${k}" ${mode===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="workbody">${outline?`<aside class="outline"><h3>Структура</h3>${names.map((n,i)=>`<button class="${chapter===i?'active':''}" onclick="chapter=${i};render()">${n}</button>`).join('')}</aside>`:''}<div class="canvas">${mode==='diff'?inline?`<article class="paper"><h3>${names[chapter]}</h3><div class="${highlight?'old':''}">${old}</div><div class="${highlight?'new':''}">${next}</div></article>`:`<div class="split">${[old,next].map((s,i)=>`<div><small>Версия ${7+i}</small><article class="paper"><h3>${names[chapter]}</h3><div class="${highlight?i?'new':'old':''}">${s}</div></article></div>`).join('')}</div>`:`<article class="paper">${content}</article>`}</div>${panel?`<aside class="aux"><div class="row between"><h3>${{comments:'Правки',materials:'Материалы',history:'История версий',format:'Оформление'}[panel]}</h3><button onclick="panel='';render()" aria-label="Закрыть панель">×</button></div>${aux}</aside>`:''}<aside class="rail">${[['comments','▤','Правки'],['materials','▱','Материалы'],['history','◷','История'],['format','☑','Оформление']].map(([k,s,n])=>`<button title="${n}" aria-label="${n}" class="${panel===k?'active':''}" onclick="panel=panel==='${k}'?'':'${k}';render()">${s}</button>`).join('')}</aside></div><div class="foot">Страница 8 из 42 <span class="spacer"></span> ГОСТ 7.32-2017 · 100%</div></div>`}function auth(register){return `<div class="auth surface"><h1>${register?'Регистрация студента':'Вход в систему'}</h1>${(register?['Фамилия','Имя','Отчество','Учебная группа','Электронная почта','Пароль','Повторите пароль']:['Электронная почта','Пароль']).map(s=>`<label class="field">${s}<input type="${s.toLowerCase().includes('пароль')?'password':'text'}"></label>`).join('')}<button class="primary" style="width:100%" onclick="dialog('Демо','Авторизация не подключена.')">${register?'Создать аккаунт':'Войти'}</button><p><button class="link" onclick="go('${register?'login':'register'}')">${register?'Уже есть аккаунт? Войти':'Создать аккаунт студента'}</button></p></div>`}function profile(){return `<h1>Мой профиль</h1><div class="tabs">${['Личные данные','Безопасность','Уведомления'].map((s,i)=>`<button onclick="document.getElementById('profile-content').innerHTML=profileFields(${i})">${s}</button>`).join('')}</div><div class="surface" id="profile-content">${profileFields(0)}</div>`}function profileFields(i){return i===2?'<h2>Уведомления по почте</h2><label><input type="checkbox" checked> Новые замечания</label>':(i===0?['Фамилия','Имя','Отчество','Электронная почта','Учебная группа']:['Текущий пароль','Новый пароль','Повторите пароль']).map(s=>`<label class="field">${s}<input ${i===1?'type="password"':''} ${s==='Учебная группа'?'readonly value="ИДБ-23-08"':''}></label>`).join('')+'<button class="primary" onclick="dialog(\'Демо\',\'Сервер не подключён\')">Сохранить</button>'}function kit(){return `<h1>Каталог компонентов</h1><h2>Кнопки</h2><div class="row"><button class="primary">Сохранить</button><button>Отмена</button><button class="accent">Принять замену</button><button class="danger">Удалить</button><button disabled>Недоступно</button></div><h2 class="section">Статусы</h2><div class="row">${states.slice(0,4).map(s=>status(...s)).join('')}${status('Отклонено','rejected')}</div><h2 class="section">Поля</h2><label class="field">Название<input placeholder="Введите название"></label><label class="field">Комментарий<textarea rows="3"></textarea></label><h2 class="section">Сравнение</h2><div class="old">${old}</div><div class="new">${next}</div><h2 class="section">Пустое состояние</h2><div class="surface">Замечаний нет<p class="muted">На данный момент у вас нет открытых замечаний.</p></div><h2 class="section">Ошибка</h2><div class="surface"><p style="color:var(--color-error)">Не удалось загрузить данные</p><button>Повторить</button></div>`}function render(){app.innerHTML=page==='editor'?editor():((page==='login'||page==='register')?'<header><strong>Норма</strong></header>':head())+'<main>'+({home,reviews,materials,login:()=>auth(false),register:()=>auth(true),profile,kit}[page]())+'</main>'}render();
</script></body></html>
