name: norma

x-api: &api
  image: norma-api:local
  build:
    context: ./backend
  environment:
    NORMA_DATABASE_HOST: postgres
    NORMA_DATABASE_PORT: 5432
    NORMA_DATABASE_NAME: ${NORMA_DATABASE_NAME:-norma}
    NORMA_DATABASE_USER: ${NORMA_DATABASE_USER:-norma}
    NORMA_DATABASE_PASSWORD: ${NORMA_DATABASE_PASSWORD:?Set NORMA_DATABASE_PASSWORD in .env}
    NORMA_DATABASE_CONNECT_TIMEOUT_SECONDS: ${NORMA_DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
    NORMA_READINESS_TIMEOUT_SECONDS: ${NORMA_READINESS_TIMEOUT_SECONDS:-3}
    NORMA_SESSION_LIFETIME_SECONDS: ${NORMA_SESSION_LIFETIME_SECONDS:-28800}
    NORMA_SESSION_COOKIE_SECURE: ${NORMA_SESSION_COOKIE_SECURE:-false}
    NORMA_DOCUMENT_LEASE_SECONDS: ${NORMA_DOCUMENT_LEASE_SECONDS:-120}
    NORMA_PDF_CONVERTER: ${NORMA_PDF_CONVERTER:-libreoffice}
    NORMA_PDF_TIMEOUT_SECONDS: ${NORMA_PDF_TIMEOUT_SECONDS:-60}
    NORMA_PLAGIARISM_ENABLED: ${NORMA_PLAGIARISM_ENABLED:-false}
    NORMA_PLAGIARISM_WSDL_URL: ${NORMA_PLAGIARISM_WSDL_URL:-https://api.antiplagiat.ru:4959/apiCorp/testapi?wsdl}
    NORMA_PLAGIARISM_SITE_URL: ${NORMA_PLAGIARISM_SITE_URL:-https://testapi.antiplagiat.ru}
    NORMA_PLAGIARISM_LOGIN: ${NORMA_PLAGIARISM_LOGIN:-}
    NORMA_PLAGIARISM_PASSWORD: ${NORMA_PLAGIARISM_PASSWORD:-}
    NORMA_PLAGIARISM_REQUEST_TIMEOUT_SECONDS: ${NORMA_PLAGIARISM_REQUEST_TIMEOUT_SECONDS:-30}
    NORMA_PLAGIARISM_POLL_SECONDS: ${NORMA_PLAGIARISM_POLL_SECONDS:-10}
    NORMA_PLAGIARISM_CHECK_TIMEOUT_SECONDS: ${NORMA_PLAGIARISM_CHECK_TIMEOUT_SECONDS:-3600}
    NORMA_PLAGIARISM_MAX_TEXT_BYTES: ${NORMA_PLAGIARISM_MAX_TEXT_BYTES:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NORMA_DATABASE_NAME:-norma}
      POSTGRES_USER: ${NORMA_DATABASE_USER:-norma}
      POSTGRES_PASSWORD: ${NORMA_DATABASE_PASSWORD:?Set NORMA_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NORMA_DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5).close()"
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 10s

  worker:
    <<: *api
    command: ["python", "-m", "app.api_v1.plagiarism.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
